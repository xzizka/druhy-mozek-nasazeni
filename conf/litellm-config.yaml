# =====================================================================
# LiteLLM Proxy - fáze 1
#
# Veškerá generativní inference je externí. LiteLLM tady není kvůli
# routingu (OpenRouter routuje sám), ale kvůli třem věcem, které jinde
# nedostaneš: jeden OpenAI-kompatibilní endpoint pro všechny providery,
# virtual keys s rozpočtem per komponenta, a jedno místo pro telemetrii.
#
# Image pinuj na konkrétní stable tag, ne main-latest. LiteLLM vydává
# velmi často a DB migrace bývají breaking.
# =====================================================================

model_list:
  # -------------------------------------------------------------------
  # Těžké uvažování. Alias, ne konkrétní model - komponenty volají
  # "reasoning" a výměna modelu pod tím je konfigurační změna.
  # -------------------------------------------------------------------
  # OPRAVA: v ZIPu bylo `model: openai/big-pickle-large` s poznámkou
  # "uprav podle skutečného API" a BIGPICKLE_API_BASE mířil na
  # https://api.bigpickle.example/v1 — .example je rezervovaná TLD (RFC 2606),
  # tedy placeholder. Skutečný poskytovatel je OpenCode Zen:
  #   base  https://opencode.ai/zen/v1   (OpenAI-kompatibilní)
  #   model big-pickle                   (ověřeno ve /v1/models)
  # Prefix openai/ říká LiteLLM "OpenAI-kompatibilní endpoint", takže
  # na provider jde model jako `big-pickle`.
  #
  # POZOR: OpenCode Zen v době nasazení pouští requesty i BEZ Authorization
  # hlavičky (free preview), ale NEPLATNÝ klíč aktivně odmítne
  # ("AuthError: Invalid API key"). Placeholder v secretu proto nestačí —
  # musí tam být skutečný klíč z https://opencode.ai/auth (zdarma).
  #
  # ===================================================================
  # KROK 2, 2026-08-18: big-pickle -> openai/gpt-oss-120b na OpenRouteru.
  #
  # Duvod nebyl cena (big-pickle byl zdarma), ale dve veci z P8: kvota se
  # vycerpava s neznamym rozvrhem, a podle dokumentace OpenCode Zen smi
  # obsah poznamek vcetne deniku slouzit k trenovani modelu. Tim padem
  # zustava jediny poskytovatel a jediny secret.
  #
  # Kvalita zmerena (`scripts/24-eval-reasoning.py`): 4/4, tedy stejne
  # jako Claude Haiku 4.5 i jako tyz model na nexos.ai. Vcetne dvou pasti,
  # kde odpoved v uryvcich NENI a model ma priznat, ze ji nema (P4).
  #
  # PROC `extra_body.provider` A NE VYCHOZI ROUTING:
  # `gpt-oss-120b` nabizi na OpenRouteru dvacet poskytovatelu s latenci
  # od 0,6 s do 51 s. Vychozi routing sype pokazde jinam — dva merene
  # behy tehoz nastaveni daly median 6,63 s a 12,99 s, s maximy 15,95
  # a 30,68 s. Neni to pomale, je to NEMERITELNE, a u dotazu z Telegramu
  # to uzivatel pozna.
  #
  # Zmereno 2026-08-18, `scripts/25-eval-or-routing.py`, 4 volani na
  # konfiguraci, serazeno podle ceny za 600 dotazu mesicne:
  #
  #   poskytovatel   $/mes   median (min-max)   chyb  kvantizace
  #   CoreWeave      0,091   16,85 (14,2-32,7)    0   fp4
  #   DeepInfra      0,103    6,89 ( 4,6- 7,2)    0   bf16   <- VOLBA
  #   Novita         0,144    5,57                3   fp4
  #   DigitalOcean   0,185    9,73 ( 7,4-21,4)    0   ?
  #   SiliconFlow    0,192   16,42 (14,4-47,9)    0   fp8
  #   Google         0,238   39,47 (27,3-51,6)    2   ?
  #   Mancer 2       0,263    4,93 ( 4,5- 5,6)    0   fp8
  #   BaseTen        0,288    2,11 ( 2,0- 2,7)    0   fp4
  #   Groq           0,396    1,15 ( 1,1- 1,3)    0   ?
  #   Cerebras       0,768    0,98 ( 0,6- 1,4)    2   fp16
  #
  # `sort: price` vede na CoreWeave, tedy na 16,85 s — automaticka volba
  # podle ceny je ta nejhorsi. `sort: throughput` vede na Cerebras za
  # 0,98 s, ale 7,5x drazsi. DeepInfra je vybrana jako nejlevnejsi
  # pouzitelna: o 13 % drazsi nez CoreWeave, ale 2,4x rychlejsi, s uzkym
  # rozptylem a v bf16 misto fp4.
  #
  # `allow_fallbacks: false` je ZAMERNE. Bez nej by OpenRouter pri vypadku
  # DeepInfry sahl na kohokoliv — tedy klidne na Google se 39 s. Retez
  # nize je vybrany tak, aby zadny jeho clen nemel median nad 7 s
  # a zadnou chybu v mereni; strop pri propadu az na BaseTen je 0,288
  # $/mesic a ~2,1 s. Kdyz spadnou vsichni tri, request selze a LiteLLM
  # propadne na `workhorse` — presne jak fallback nize predpoklada.
  #
  # POZOR NA `drop_params: true` v `litellm_settings`. `provider` NENI
  # parametr OpenAI API, ale rozsireni OpenRouteru, takze hrozi, ze ho
  # LiteLLM tise zahodi a routing zustane vychozi — pricemz config bude
  # vypadat spravne. Po nasazeni to OVER: zavolej alias ctyrikrat a koukej,
  # jestli `provider` v odpovedi drzi na DeepInfra, nebo se meni.
  # ===================================================================
  - model_name: reasoning
    litellm_params:
      model: openrouter/openai/gpt-oss-120b
      api_key: os.environ/OPENROUTER_API_KEY
      extra_body:
        provider:
          order: ["DeepInfra", "Mancer 2", "BaseTen"]
          allow_fallbacks: false
      timeout: 120
      num_retries: 2
      # big-pickle je reasoning model: tokeny utraci na reasoning_content
      # driv, nez zacne psat odpoved. Pri max_tokens=300 vratil PRAZDNY
      # content s finish_reason=length a 817 znaku uvahy - tedy tiche
      # selhani bez chyby, ktere by se v pipeline projevilo jako prazdny
      # vysledek. Merenim: kratka ceska uloha spotrebovala 402 tokenu.
      # 4000 da rezervu i delsim uloham.
      #
      # DOMERENO 2026-08-18 pro gpt-oss-120b: reasoning_tokens median 109,
      # maximum 184 — tedy radove mensi apetit nez big-pickle, ktery sam
      # utratil 402 a vic.
      #
      # Tim se otevrela a HNED PROVEDLA oprava P8(b), krok 3: Kryton posilal
      # ANSWER_MAX_TOKENS=8000 (hodnotu zvolenou kvuli big-pickle) a ta se
      # aplikovala i na fallbacky, kde byla primou pricinou zacykleni gemmy
      # ze 2026-08-17. Snizeno na 2000 v `kryton/app/config.py` — NE tady,
      # protoze hodnota z requestu ma prednost, takze strop urcuje Kryton
      # a tenhle `max_tokens: 4000` je jen default pro klienta, ktery zadny
      # neposle. Podklad: `scripts/26-eval-answer-max-tokens.py`, 11 volani,
      # maximum 534 tokenu, zadne finish_reason=length.
      #
      # POZOR: tohle je DEFAULT pro pripad, kdy klient max_tokens neposle.
      # Hodnota z requestu ma prednost - viz komentar u drop_params.
      max_tokens: 4000

  # -------------------------------------------------------------------
  # OPRAVA POPISU 2026-08-18. Tenhle blok se dřív jmenoval „pracovní kůň
  # pro běžné úlohy" a komentáře napříč configem mu připisovaly „titulek
  # a tagy při indexaci". **Taková úloha v kódu neexistuje.**
  #
  # Ověřeno grepem přes celý repozitář: jediné aliasy, které kód nastavuje
  # jako `model`, jsou `cheap` (`REWRITE_MODEL` v retrievalu) a `reasoning`
  # (`ANSWER_MODEL` a `ANALYTICS_MODEL` v Krytonovi). Indexer používá LLM
  # jen na detekci jazyka a jde přes `cheap` — viz docstring `indexer.py`,
  # krok 3. `workhorse` se v kódu vyskytuje jedině v seznamu modelů, které
  # smí volat virtual key Krytona (`scripts/03-quadlets.sh:406`), a to
  # právě proto, aby fungoval fallback.
  #
  # SKUTEČNÁ ROLE: **první záchyt fallbacku za `reasoning`.** Nic víc.
  # Za normálního provozu se nezavolá ani jednou.
  #
  # Proč na tom záleží: přesně tenhle alias 2026-08-13 až 17 tiše obsloužil
  # VŠECHEN provoz Krytona, když big-pickle vyčerpal kvótu (P8). Model se
  # tu nevybírá pro mechanické úlohy, ale pro to, aby uměl odpovědět na
  # RAG dotaz s citacemi — což je jiné zadání, než jaké tu bylo napsané.
  #
  # Gemma tu roli zvládá: v měření 2026-08-18
  # (`scripts/24-eval-reasoning.py`) dala 4/4 s mediánem 2,9 s na téže
  # úloze, na které gpt-oss-120b dal 4/4 za 11,0 s. Zůstává tedy — ale
  # nově ze změřeného důvodu, ne z omylu.
  # -------------------------------------------------------------------
  - model_name: workhorse
    litellm_params:
      # ZMENA: puvodne openrouter/anthropic/claude-sonnet-4.5, pote
      # poolside/laguna-s-2.1:free. Laguna je code-centric model - na ceske
      # uloze byla verbozni, vycerpala token limit bez dokonceni zadani
      # a napsala "Praga" misto "Praha".
      #
      # gemma-4-26b vybrana merenim na ceskych ulohach:
      #   - zakladni tvary: latence, index, vektorovy, resit  (vse spravne)
      #   - 6 davkovych volani: 5/6 uspech, median 3,6 s, prumer 19 tokenu
      #   - drzi cestinu; nemotron-3-ultra ve 2 z 6 pripadu vypsal anglickou
      #     uvahu misto odpovedi, coz by se tise ulozilo do indexu
      #
      # ZMENA 2026-08-18 (krok 1): odebrana pripona `:free`. TYZ MODEL,
      # jiny tarif. Duvod je denni strop free tieru 50 pozadavku/den na
      # cely ucet — kvuli nemu se 2026-08-08 zaindexovalo pet dokumentu
      # se spatnym jazykem, protoze `detect_language()` pri vycerpani
      # kvoty tise propadne na DEFAULT_LANG. Placeny tarif strop nema.
      #
      # Riziko nulove: je to presne ten model, ktery uz bezi jako
      # `cheap-fallback` (o dva bloky niz) a ktery byl 2026-08-09 zmeren
      # na 20/20 detekce jazyka a 10/10 prepis dotazu.
      #
      # Cena ~0,015 $/mesic pri 10 indexovanych dokumentech denne.
      model: openrouter/google/gemma-4-26b-a4b-it
      api_key: os.environ/OPENROUTER_API_KEY
      timeout: 90
      # Zvednuto 2 -> 3 (P6, 2026-08-12): reasoning->workhorse->backstop
      # spadl celý najednou na krátkém souběžném zahlcení tří poskytovatelů;
      # backstop hlásil retry_after_seconds: 3, o to by mohl treti pokus
      # prehoupnout.
      num_retries: 3

  # -------------------------------------------------------------------
  # Levný model na mechanické úlohy: tagování, titulky, přepis dotazu.
  # Sem míří většina volání z indexační pipeline, takže cena za token
  # rozhoduje víc než kvalita.
  # -------------------------------------------------------------------
  - model_name: cheap
    litellm_params:
      # ZMENA 2026-08-09: gemma-4-26b-a4b-it:free -> ling-2.6-flash (PLACENY).
      #
      # Duvod neni cena, ale denni strop. `:free` varianty spadaji pod free
      # tier OpenRouteru: 50 pozadavku/den pod 10 nakoupenymi kredity, 20/min.
      # A `REWRITE_MODEL` v retrievalu je `cheap`, takze kvotu pali KAZDE
      # hledani, ne jen indexace - padesat dotazu denne a konec. Pri vycerpani
      # navic `detect_language()` propadne na DEFAULT_LANG=cs uplne potichu,
      # cimz se 2026-08-08 zaindexovalo 5 dokumentu se spatnym jazykem.
      # Placene modely denni strop nemaji.
      #
      # ling-2.6-flash je zaroven NEJLEVNEJSI placeny model v katalogu
      # (378 placenych, $0,010/M vstup, $0,030/M vystup) - asi 7,7x levnejsi
      # nez placena gemma. Detekce jazyka posila ~400 tokenu, takze jedno
      # volani vyjde na ~0,0004 c.
      #
      # Overeno 2026-08-09 skutecnymi prompty z rewrite.py, 30 volani:
      #   detekce jazyka cs/en/de/la   20/20
      #   prepis dotazu vcetne pasti   10/10  (maintenance_work_mem nerozbity,
      #                                       anglicke "faster" nenormalizovano)
      #   latence  median 0,88 s, max 1,41 s  (gemma 1,44 s / 5,09 s)
      # Odmitnuti kandidati: granite-4.0-h-micro urcil cestinu jako anglictinu,
      # ling-3.0-flash a qwen3.7-flash vraceji prazdny content (reasoning
      # modely utrati max_tokens na uvahu - tataz past jako u big-pickle).
      #
      # DOMERENO 2026-08-10 (scripts/17-eval-cheap-models.py): ministral-3b-2512
      # a ministral-8b-2512 nezaujaty. Latence 2x nizsi (median 0,38-0,39 s),
      # ale drazsi (0,10-0,15 $/M proti 0,01-0,03 $/M u ling) a horsi presnost
      # (8/10 a 7/10 proti 9/10). Oba popletli hranici cs/en presne na pasti
      # "faster": 3b urcil anglicky dotaz jako cesky a slovo zahodil, 8b
      # naopak prepsal DVA ceske dotazy do anglictiny. 3b navic jednou minul
      # cistou detekci bez pasti (cs -> en). Pri volnem psani obaluje odpoved
      # do cislovaneho seznamu i kdyz SYSTEM prompt Krytona chce "plynulou
      # cestinu" - stylisticky tik, ktery by se projevil az u uzivatele.
      #
      # ZMENA 2026-08-27: ling-2.6-flash -> qwen3-30b-a3b-instruct-2507.
      #
      # Duvod NENI cena ani sleva, ale zjisteni, ze ling-2.6-flash uz na
      # OpenRouteru NEMA ZADNY endpoint (`GET /models/.../endpoints` vraci
      # `endpoints: []`, primo volani dava HTTP 404 "no longer available as
      # a free model"). Protoze `cheap` je horka cesta KAZDEHO hledani
      # (REWRITE_MODEL), kazdy pozadavek nejdriv platil neuspesne volani na
      # mrtvy model a teprve pak padal na `cheap-fallback` (placena gemma) -
      # dvojita latence a nulova uspora, ktere `cheap` mel prinaset.
      #
      # Nahrada je zaroven ve slevove kolekci OpenRouteru (-55 % k 2026-08-27,
      # https://openrouter.ai/collections/discounted-models), 0,048/0,193 $/M
      # proti 0,070/0,340 u gemmy.
      #
      # Zmereno stejnou metodikou jako puvodni vyber ling (adaptace
      # scripts/17-eval-cheap-models.py, skutecne prompty z rewrite.py):
      #   detekce jazyka cs/en/de/la   20/20
      #   prepis dotazu vcetne pasti    9/10  (minul jen past "faster" ->
      #                                       urcil cs misto en; identifikatory
      #                                       a latinska tazaci slova OK)
      #   latence  median 2,06 s, max 3,36 s
      # Pro srovnani gemma (dnesni workhorse/cheap-fallback) na tehoz testu:
      # 19/20 (1 selhani je DNS vypadek stanice, ne model) a 8/10 - qwen tedy
      # gemmu prekonal na obou osach za nizsi cenu. Odmitnuty kandidat ve
      # stejnem kole: upstage/solar-pro4 (sleva -90 %, jeste levnejsi), ale
      # na prepisu jen 7/10 - minul past "faster" A nechal latinska tazaci
      # slova "ubi"/"quid" v klicovych slovech. Nejvyssi sleva a nejnizsi
      # cena nejsou tu samo o sobe duvod k vyberu.
      #
      # Podklad: pamet cheap-ling-mrtvy-qwen-kandidat.md.
      model: openrouter/qwen/qwen3-30b-a3b-instruct-2507
      api_key: os.environ/OPENROUTER_API_KEY
      timeout: 60
      # Pridano soubezne s vyse: P9 (POZADAVKY.md) navrhoval `num_retries: 2`
      # u `cheap` uz 2026-08-18 kvuli 429 z upstream_provider_shared_pool na
      # ling-2.6-flash, ktery mel jen jednoho poskytovatele (Novita) a nebylo
      # kam propadnout. Nikdy nenasazeno. qwen3-30b-a3b-instruct-2507 ma na
      # OpenRouteru peti poskytovatelu (StreamLake, SiliconFlow, CoreWeave,
      # Nebius, Alibaba), takze riziko jednoho bodu selhani je uz nizsi, ale
      # retry proti kratkodobemu 429 je levna pojistka, kterou `workhorse`
      # i `backstop` maji od P6 taky. Zaviraji se tim P9.
      num_retries: 2

  # -------------------------------------------------------------------
  # Zaloha pro `cheap`. Placena gemma - tedy presne ten model, ktery
  # `cheap` do 2026-08-09 pouzival, jen bez `:free` a tim i bez stropu.
  #
  # POZOR, tohle NEODPORUJE zasade nize u fallbacku, ze `cheap` radeji
  # spadne nahlas. Ta zasada mirila na `backstop`: gpt-oss-20b vratil
  # cesky spravne, ale obsahove smyslenou odpoved, a verohodny nesmysl
  # je pro index horsi nez selhani. Gemma je proti tomu na teto uloze
  # zmerena (20/20 detekce, 10/10 prepis) - je to znama velicina, ne
  # generator pravdepodobne vypadajiciho nesmyslu.
  # -------------------------------------------------------------------
  - model_name: cheap-fallback
    litellm_params:
      model: openrouter/google/gemma-4-26b-a4b-it
      api_key: os.environ/OPENROUTER_API_KEY
      timeout: 60

  # -------------------------------------------------------------------
  # Poslední záchrana pro fallback řetěz — v ZIPu nebyla, přidáno.
  #
  # Důvod: `workhorse` i `cheap` míří na tentýž gemma model, takže původní
  # fallback workhorse -> cheap nechránil proti ničemu. Když gemma vrátí 429
  # (v dávkovém testu 1 volání ze 6), sáhne fallback na tentýž rate-limitovaný
  # endpoint. `cheap` navíc neměl fallback vůbec žádný — LiteLLM to hlásil
  # jako "No fallback model group found for original model_group=cheap".
  #
  # gpt-oss-20b je z testovaných free modelů jediný další, který na české
  # úloze odpověděl správně (základní tvary: latence, index, vektorový,
  # řešit). Je ale pomalý (~21 s) a verbózní — v testu vyčerpal 700 tokenů
  # bez dokončení zadání. Proto vyšší max_tokens i timeout: na poslední
  # záchranu jde o to, aby vůbec odpověděla, ne aby byla rychlá.
  # -------------------------------------------------------------------
  - model_name: backstop
    litellm_params:
      #
      # ZMENA 2026-08-18 (krok 1): odebrana pripona `:free`. TYZ MODEL,
      # jiny tarif — stejny duvod jako u `workhorse` vyse. `backstop` je
      # posledni clanek fallback retezu za `reasoning`, takze zrovna on
      # nesmi byt ten, ktery padne na vycerpane kvote; presne to se stalo
      # 2026-08-12 pri incidentu P6.
      #
      # Pozor, P6 to CELE neresi: tehdy sel 429 z
      # `upstream_provider_shared_pool`, tedy ze sdileneho fondu zdarma,
      # ktery placeny tarif obchazi — ale kratkodobe 429 od poskytovatele
      # existuji i u placenych modelu. Proto `num_retries: 3` zustava.
      #
      # Cena ~0,003 $/mesic (backstop se volá jen kdyz `reasoning` selze).
      model: openrouter/openai/gpt-oss-20b
      api_key: os.environ/OPENROUTER_API_KEY
      timeout: 150
      max_tokens: 2500
      # Pridano 2026-08-12 (P6): drive zadny num_retries, jelo se na
      # defaultu LiteLLM. backstop je posledni zachrana v retezu
      # reasoning, proto stejnych 3 jako u workhorse.
      num_retries: 3

  # POZN. 2026-08-18: tady byly PĚT pokusných aliasů `*-nexos` k A/B testu
  # proti nexos.ai. **Odstraněny týž den, protože test skončil zamítnutím.**
  #
  # Krátce proč, ať to nikdo nezkouší znovu naslepo: katalog, který
  # organizace povoluje, je vyčerpaný na osmnácti modelech a z nich jsou
  # pro roli `cheap` použitelné dva. `openai/gpt-oss-120b` stojí na
  # nexos.ai 0,800/1,600 $/M proti 0,030/0,170 na OpenRouteru — 27x víc za
  # týž model, protože si ho nexos.ai hostuje sám. Jediné, co umí lépe, je
  # stabilní latence, a tu vyřešilo `extra_body.provider` u `reasoning`
  # výše, zdarma.
  #
  # Odstraněny i proto, že byly aktivně škodlivé: LiteLLM u nich při každém
  # restartu hlásil `register_model: ... not in built-in cost map` (jména
  # s mezerami a UUID nejde ocenit), takže osm varování do logu, a secret
  # `NEXOS_API_KEY` na brainu vůbec neexistoval — při zavolání by selhaly.
  #
  # Celý rozbor včetně měření zůstává v `NEXOS-ANALYZA.md` a ve skriptech
  # `22-eval-nexos-models.py` a `23-nexos-pripravenost.py`.

  # -------------------------------------------------------------------
  # Volitelný lokální model (fáze 4). Zakomentovaný, dokud llama.cpp
  # neběží - LiteLLM by jinak při startu hlásil nedostupný endpoint.
  # -------------------------------------------------------------------
  # - model_name: local-light
  #   litellm_params:
  #     model: openai/qwen3-1.7b
  #     api_base: http://llamacpp:8088/v1
  #     api_key: none

router_settings:
  routing_strategy: simple-shuffle
  # Když spadne primární alias, zkus levnější. Pořadí je vědomé: raději
  # horší odpověď než žádná, protože indexační pipeline nesmí stát.
  #
  # ZMENA proti navrhu: puvodne bylo
  #     - reasoning: ["workhorse"]
  #     - workhorse: ["cheap"]
  #
  # Dva duvody na uprave:
  #
  # 1) Hop workhorse -> cheap byl no-op. Oba aliasy miri na tentyz gemma
  #    model, takze fallback sahal na tentyz rate-limitovany endpoint.
  #
  # 2) Fallback ma `reasoning`, ale UMYSLENE NE `workhorse` a `cheap`.
  #    Zasada z README "radeji horsi odpoved nez zadna" plati pro
  #    dostupnost, ale obraci se u dat, ktera plni index. Merenim zjisteno,
  #    ze backstop (gpt-oss-20b) na poznamce o hunspellu vratil cesky
  #    spravne, ale obsahove smyslene "Poznamky z ceskeho kurzu / kurz
  #    jazyk priklady". Verohodne vypadajici nesmysl je pro index horsi nez
  #    selhani, protoze ho nikdo nezachyti. `cheap` a `workhorse` proto
  #    radeji spadnou nahlas a indexace se zastavi s chybou.
  #
  #    `reasoning` fallback ma, protoze jde o interaktivni dotazy, kde
  #    spatnou odpoved uvidis.
  #
  # DOPLNENO 2026-08-09: `cheap` uz fallback MA, ale jen na `cheap-fallback`,
  # coz je placena gemma - model na teto uloze zmereny (20/20 detekce,
  # 10/10 prepis). Bod 2) vyse tim porusen neni: mluvi o `backstop`, ktery
  # umi vratit verohodne vypadajici nesmysl. Retez zamerne NEPOKRACUJE na
  # `backstop`; kdyz selze i gemma, `cheap` porad spadne nahlas.
  #
  # POZOR: fallback na jiny model_group vyzaduje, aby ho virtual key smel
  # volat. Klic `retrieval-service` mel puvodne models=["cheap"] a fallback
  # by se o to tise rozbil - musi tam byt i "cheap-fallback".
  # `workhorse` fallback dal nema — a nepotrebuje ho: sam JE fallback
  # a za nim v retezu stoji `backstop`. (Drivejsi zduvodneni „dela jinou
  # ulohu, titulek a tagy" bylo mylne, viz opravu u definice aliasu.)
  #
  # POZOR PO ZMENE 2026-08-18: `workhorse` a `cheap-fallback` ted miri na
  # UPLNE TYZ model (placena gemma-4-26b-a4b-it). Drive to byly dva tarify
  # tehoz modelu, ted uz ani to ne. NEPRIDAVEJ mezi ne fallback — byl by
  # to presne ten no-op, kvuli kteremu se 2026-08-09 rusil hop
  # `workhorse -> cheap`: fallback by sahal na tentyz endpoint, ktery
  # prave selhal. Oddelene zustavaji kvuli opravnenim virtual keys
  # (`retrieval-service` smi `cheap-fallback`, ale `workhorse` ne).
  fallbacks:
    - reasoning: ["workhorse", "backstop"]
    - cheap: ["cheap-fallback"]
  allowed_fails: 2
  cooldown_time: 30

litellm_settings:
  drop_params: true
  # In-memory cache. Ve fázi 1 není Valkey a pro jednu repliku nemá smysl -
  # cache se ztratí při restartu, což u dotazů nikoho nebolí.
  cache: true
  cache_params:
    type: local
    ttl: 3600
  # Telemetrie. Přepni na phoenix/otel, pokud jedeš observabilitu lokálně.
  #
  # ZMĚNA proti návrhu: zakomentováno, protože nemáme langfuse_public_key
  # ani langfuse_secret_key. S nastavenými callbacky by LiteLLM hlásil chybu
  # u každého requestu. Zapni takto:
  #   1) printf '%s' 'pk-lf-...' | podman secret create langfuse_public_key -
  #      printf '%s' 'sk-lf-...' | podman secret create langfuse_secret_key -
  #   2) do litellm.container přidat:
  #      Secret=langfuse_public_key,type=env,target=LANGFUSE_PUBLIC_KEY
  #      Secret=langfuse_secret_key,type=env,target=LANGFUSE_SECRET_KEY
  #   3) odkomentovat oba řádky níže a systemctl restart litellm
  # success_callback: ["langfuse"]
  # failure_callback: ["langfuse"]
  # Neposílej obsah promptů do telemetrie, dokud nevyřešíme bezpečnostní
  # fázi. Metadata a spotřeba tokenů stačí k tomu, aby platforma byla
  # měřitelná; obsah poznámek je jiná kategorie dat.
  turn_off_message_logging: true

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  database_url: os.environ/DATABASE_URL
  # Salt pro šifrování uložených provider klíčů. ZMĚNA TÉHOTO KLÍČE
  # ZNEPLATNÍ VŠECHNY ULOŽENÉ KLÍČE - zacházej s ním jako s master key.
  salt_key: os.environ/LITELLM_SALT_KEY
  # Spend logy rostou s každým requestem. Pro jednoho uživatele je chceš
  # (jsou to jediná data o nákladech), ale nastav si retention.
  disable_spend_logs: false
  # Zdravotní check modelů při startu vypnutý - externí providery bys
  # při každém restartu platil.
  background_health_checks: false

# =====================================================================
# Virtual keys vytváříš přes /key/generate, ne v tomhle souboru.
# Každá komponenta dostane vlastní klíč s vlastním rozpočtem, aby
# rozbitá smyčka v jedné z nich nevyčerpala kredit celé platformy:
#
#   curl -X POST http://litellm:4000/key/generate \
#     -H "Authorization: Bearer $LITELLM_MASTER_KEY" \
#     -d '{"key_alias":"retrieval-service",
#          "models":["cheap","cheap-fallback"],
#          "max_budget":5, "budget_duration":"30d",
#          "rpm_limit":60}'
#
# Retrieval service má vědomě jen "cheap" - nemá důvod volat reasoning
# model a omezení modelů je nejjednodušší forma damage controlu.
# "cheap-fallback" tam být MUSÍ, jinak se fallback z router_settings
# neprovede: klíč cílový model_group nesmí volat a LiteLLM to odmítne.
# =====================================================================
