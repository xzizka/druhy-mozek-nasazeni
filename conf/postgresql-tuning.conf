# =====================================================================
# PostgreSQL 17 - ladění pro fázi 1 na 16 GB stroji s pgvector
# Montuj do /etc/postgresql/conf.d/10-tuning.conf a přidej do
# postgresql.conf: include_dir = '/etc/postgresql/conf.d'
#
# Cílový profil: jeden uživatel, korpus poznámek, ANN dotazy nad HNSW,
# RSS Postgresu ~2,5 GB, zbytek rozpočtu je page cache.
# =====================================================================

# ---------------------------------------------------------------------
# Paměť
# ---------------------------------------------------------------------
# 2 GB je záměrně méně než obvyklá čtvrtina RAM. Na tomhle stroji je
# užitečnější nechat paměť OS page cache, protože HNSW index i heap čte
# Postgres přes ni, a shared_buffers by je jen duplikovaly.
shared_buffers = 2GB

# Odhad, kolik dat je celkově v cache (shared_buffers + OS page cache).
# Ovlivňuje jen plánovač. Nadhodnocení tlačí k index scanům, což u ANN
# dotazů chceme.
effective_cache_size = 5GB

# Nízké, protože paralelních dotazů je málo. Pozor na multiplikaci:
# work_mem se alokuje per sort/hash node a per parallel worker.
work_mem = 24MB

# Klíčové pro HNSW build. Když se build nevejde do maintenance_work_mem,
# spadne do spill-to-disk a poteče několikanásobně déle. 1 GB je špička,
# ne trvalá alokace - build spouštěj, když neběží nic jiného.
maintenance_work_mem = 1GB

# Jeden uživatel a hrst služeb. Každé připojení je proces s vlastní
# režií, takže tady se šetří reálná paměť.
max_connections = 50

# Nemá smysl při 2 GB shared_buffers a komplikuje to provoz v kontejneru.
huge_pages = off

# ---------------------------------------------------------------------
# Paralelismus
# ---------------------------------------------------------------------
max_worker_processes = 8
max_parallel_workers = 4
max_parallel_workers_per_gather = 2
# Dva paralelní workery na build HNSW indexu. Víc na CPU-bound buildu
# na malém stroji nepomůže, jen si vezme paměť.
max_parallel_maintenance_workers = 2

# ---------------------------------------------------------------------
# JIT vypnutý
#
# JIT pomáhá dlouhým analytickým dotazům. Retrieval dotazy jsou krátké,
# takže JIT kompilace je čistá režie navíc - typicky desítky ms na dotaz
# a paměť, kterou jinde potřebujeme. U pgvector dotazů je to prakticky
# vždy čistá ztráta.
# ---------------------------------------------------------------------
jit = off

# ---------------------------------------------------------------------
# WAL a checkpointy
# ---------------------------------------------------------------------
wal_level = replica
# zstd je od PG15 a proti pglz i lz4 dává na WAL nejlepší kompresní
# poměr; CPU je tady k dispozici víc než I/O.
wal_compression = zstd
max_wal_size = 4GB
min_wal_size = 1GB
# Delší interval = méně full page writes = méně WAL při bulk indexaci.
checkpoint_timeout = 15min
checkpoint_completion_target = 0.9
# Archivaci zapni až s pgBackRest ve fázi 1b; do té doby by ses jen
# zaplnil WAL segmenty.
archive_mode = off

# ---------------------------------------------------------------------
# Plánovač pro NVMe
# ---------------------------------------------------------------------
random_page_cost = 1.1
effective_io_concurrency = 200
maintenance_io_concurrency = 200
# Vyšší cíl statistik pomáhá odhadům selektivity na tsvector a trigram
# indexech, kde default 100 často střílí vedle.
default_statistics_target = 200

# ---------------------------------------------------------------------
# Autovacuum
#
# Tabulka chunk se při reindexu přepisuje celá, takže default scale
# factor 0.2 je moc pozdě - bloat by rostl mezi vacuumy.
# ---------------------------------------------------------------------
autovacuum_vacuum_scale_factor = 0.05
autovacuum_analyze_scale_factor = 0.02
autovacuum_vacuum_cost_limit = 800
autovacuum_naptime = 30s

# ---------------------------------------------------------------------
# Observabilita
# ---------------------------------------------------------------------
shared_preload_libraries = 'pg_stat_statements'
pg_stat_statements.max = 5000
pg_stat_statements.track = top
track_io_timing = on
# Cokoliv nad sekundu u retrieval dotazu je defekt, ne pomalý stroj.
log_min_duration_statement = 1000
log_checkpoints = on
log_autovacuum_min_duration = 0
log_line_prefix = '%m [%p] %q%u@%d '
log_temp_files = 0

# ---------------------------------------------------------------------
# pgvector
#
# ef_search je session GUC. Funkce retrieval.hybrid_search si ho
# nastavuje sama přes klauzuli SET, takže tady je jen rozumný default
# pro ad-hoc dotazy. Vyšší hodnota = lepší recall, vyšší latence.
# ---------------------------------------------------------------------
hnsw.ef_search = 100
# Iterativní scan (pgvector 0.8+) řeší případ, kdy filtr odfiltruje
# většinu výsledků z ANN kandidátů - bez něj dostaneš méně řádků, než
# jsi chtěl. relaxed_order dovolí trochu neseřazený výstup za lepší výkon.
hnsw.iterative_scan = relaxed_order
